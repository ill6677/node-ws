<!DOCTYPE html>
<html lang="zh-CN">
<head>
   
    <meta charset="UTF-8">
    <title>极简静态</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
            line-height: 1.5;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .content {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- 页面标题 -->
    <h1>我的极简静态页面</h1>
    <!-- 主要内容区域 -->
    <div class="content">
        <p>这是一个最简单的静态HTML页面，仅包含核心结构：</p>
        <ul>
            <li>HTML5 文档声明</li>
            <li>字符编码设置（避免中文乱码）</li>
            <li>基础文本内容（标题、段落、列表）</li>
            <li>极简样式（保证可读性）</li>
        </ul>
    </div>
</body>
</html>
